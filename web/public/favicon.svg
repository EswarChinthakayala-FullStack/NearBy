<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="pinGrad" x1="10" y1="10" x2="90" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="orbitGrad" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base Container -->
  <rect width="100" height="100" rx="20" fill="#09090B" />
  
  <!-- Outer Orbit Curved Path -->
  <path d="M 20 75 Q 35 30 78 22" stroke="url(#orbitGrad)" stroke-width="3.5" stroke-linecap="round" fill="none" stroke-dasharray="3 3" />

  <!-- Radar Outer Ring -->
  <circle cx="50" cy="42" r="24" stroke="#10B981" stroke-width="2" stroke-dasharray="4 4" stroke-opacity="0.5" />

  <!-- Main Map Marker Pin -->
  <path d="M 50 15 C 33.4 15 20 28.4 20 45 C 20 66.5 45 88 48.5 91 C 49.4 91.8 50.6 91.8 51.5 91 C 55 88 80 66.5 80 45 C 80 28.4 66.6 15 50 15 Z" fill="url(#pinGrad)" filter="url(#glowEffect)" />

  <!-- Inner Compass Core -->
  <circle cx="50" cy="42" r="11" fill="#09090B" />
  <circle cx="50" cy="42" r="6" fill="#F59E0B" />

  <!-- North Direction Tip -->
  <polygon points="50,33 53,40 50,38 47,40" fill="#FAFAFA" />
</svg>