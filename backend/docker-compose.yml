version: "3.8"

services:
  api:
    build: .
    container_name: nearby_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DEBUG=False
      - MYSQL_HOST=db
      - MYSQL_PORT=3306
      - MYSQL_USER=tourism_user
      - MYSQL_PASSWORD=tourism_pass
      - MYSQL_DATABASE=nearby_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
    volumes:
      - uploads_data:/app/uploads

  celery_worker:
    build: .
    container_name: nearby_celery_worker
    restart: always
    command: celery -A celery_worker.celery_app worker --loglevel=info
    environment:
      - ENVIRONMENT=production
      - REDIS_URL=redis://redis:6379/0
      - MYSQL_HOST=db
    depends_on:
      - redis
      - db

  celery_beat:
    build: .
    container_name: nearby_celery_beat
    restart: always
    command: celery -A celery_worker.celery_app beat --loglevel=info
    environment:
      - ENVIRONMENT=production
      - REDIS_URL=redis://redis:6379/0
      - MYSQL_HOST=db
    depends_on:
      - redis
      - db

  redis:
    image: redis:7-alpine
    container_name: nearby_redis
    restart: always
    ports:
      - "6379:6379"

  db:
    image: mysql:8.0
    container_name: nearby_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: nearby_db
      MYSQL_USER: tourism_user
      MYSQL_PASSWORD: tourism_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
  uploads_data:
